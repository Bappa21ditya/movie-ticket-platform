server:
  port: 8083

spring:
  application:
    name: booking-service


  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=booking_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


inventory:
  service:
    url: http://localhost:8081


