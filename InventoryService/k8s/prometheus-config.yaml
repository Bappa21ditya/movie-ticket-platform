apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: "booking-service"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets:
              - "booking-service:8083"

      - job_name: "inventory-service"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets:
              - "inventory-service:8081"