server:
  port: 8081

spring:
  data:
    redis:
      host: redis
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms

  kafka:
    bootstrap-servers: kafka:9092

    consumer:
      group-id: inventory-seat-hold-group
      auto-offset-reset: earliest
      enable-auto-commit: true

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  datasource:
    url: jdbc:postgresql://cineverse-postgres:5432/postgres?currentSchema=inventory_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 1000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: CineVerse Inventory Service
    version: 1.0.0
    description: Movie ticket inventory and seat-hold service